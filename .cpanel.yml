---
deployment:
  tasks:
    - cd /home/fuevorco/fuevor && /usr/bin/env bash scripts/install_composer.sh /home/fuevorco/bin/composer.phar
    - cd /home/fuevorco/fuevor && /usr/bin/env php /home/fuevorco/bin/composer.phar install --no-dev --optimize-autoloader --no-interaction
    - cd /home/fuevorco/fuevor && /usr/bin/env php artisan migrate --force
    - cd /home/fuevorco/fuevor && /usr/bin/env php scripts/configure_production_mail.php
    - cd /home/fuevorco/fuevor && /usr/bin/env php artisan optimize:clear
    - cd /home/fuevorco/fuevor && /usr/bin/env php artisan config:cache
    - cd /home/fuevorco/fuevor && /usr/bin/env php artisan view:cache
